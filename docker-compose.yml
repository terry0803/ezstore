services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ezstore
      POSTGRES_PASSWORD: ezstore
      POSTGRES_DB: ezstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/cshliu77/ezstore/backend:latest
    pull_policy: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ezstore
      DB_PASSWORD: ezstore
      DB_NAME: ezstore
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  mcp-server:
    image: ghcr.io/cshliu77/ezstore/mcp-server:latest
    pull_policy: always
    environment:
      BACKEND_URL: http://backend:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      # 讓本機執行的 Agent（agents-cli playground / run / eval）也能連到 MCP Server
      - "${MCP_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started


  agent:
    # 報價單管理 Agent（ADK Graph Workflow）。本機建置請加 -f docker-compose.build.yml
    image: ghcr.io/terry0803/ezstore/agent:latest
    pull_policy: missing
    environment:
      # 模型憑證二選一，沒設時系統照常啟動，只有對話會回覆清楚的錯誤訊息
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.8-flash}
      MODEL_MAX_ATTEMPTS: ${MODEL_MAX_ATTEMPTS:-6}
      # AGENT_MODEL=openai/<模型> 時改用本機 OpenAI 相容 API（例如 llama.cpp）
      LOCAL_LLM_BASE: ${LOCAL_LLM_BASE:-http://host.docker.internal:18081/v1}
      MCP_URL: http://mcp-server:8000/mcp
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:3000}
      APP_URL: http://agent:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # port 8080 只開在 compose 內部網路，前端 nginx 以 /agent-api 轉過來
    expose:
      - "8080"
    depends_on:
      mcp-server:
        condition: service_started

  frontend:
    image: ghcr.io/cshliu77/ezstore/frontend:latest
    pull_policy: always
    ports:
      - "3000:80"
    depends_on:
      - backend
      - mcp-server
      - agent

  e2e:
    image: ghcr.io/cshliu77/ezstore/e2e:latest
    pull_policy: always
    environment:
      BASE_URL: http://frontend:80
      API_URL: http://backend:8080
    depends_on:
      - frontend
    profiles:
      - test

volumes:
  pgdata:
