* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>

<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

 "computations/price-change-impact", "target": "references/skills/run-python-computation"}}, {"data": {"id": "computations/price-change-impact__policies/discount-approval", "source": "computations/price-change-impact", "target": "policies/discount-approval"}}, {"data": {"id": "computations/price-change-impact__policies/pricing-factor-floor", "source": "computations/price-change-impact", "target": "policies/pricing-factor-floor"}}, {"data": {"id": "computations/price-change-impact__playbooks/price-negotiation", "source": "computations/price-change-impact", "target": "playbooks/price-negotiation"}}, {"data": {"id": "computations/price-change-impact__system/mcp-tools", "source": "computations/price-change-impact", "target": "system/mcp-tools"}}, {"data": {"id": "glossary/pricing-factor__system/customer-levels", "source": "glossary/pricing-factor", "target": "system/customer-levels"}}, {"data": {"id": "glossary/pricing-factor__policies/pricing-factor-floor", "source": "glossary/pricing-factor", "target": "policies/pricing-factor-floor"}}, {"data": {"id": "glossary/pricing-factor__system/pricing-formula", "source": "glossary/pricing-factor", "target": "system/pricing-formula"}}, {"data": {"id": "glossary/profit-rate__system/quotations-table", "source": "glossary/profit-rate", "target": "system/quotations-table"}}, {"data": {"id": "glossary/profit-rate__policies/discount-approval", "source": "glossary/profit-rate", "target": "policies/discount-approval"}}, {"data": {"id": "glossary/profit-rate__system/pricing-formula", "source": "glossary/profit-rate", "target": "system/pricing-formula"}}, {"data": {"id": "playbooks/price-negotiation__computations/price-change-impact", "source": "playbooks/price-negotiation", "target": "computations/price-change-impact"}}, {"data": {"id": "playbooks/price-negotiation__policies/discount-approval", "source": "playbooks/price-negotiation", "target": "policies/discount-approval"}}, {"data": {"id": "playbooks/price-negotiation__policies/pricing-factor-floor", "source": "playbooks/price-negotiation", "target": "policies/pricing-factor-floor"}}, {"data": {"id": "playbooks/price-negotiation__system/quotation-agent", "source": "playbooks/price-negotiation", "target": "system/quotation-agent"}}, {"data": {"id": "playbooks/price-negotiation__policies/order-conversion", "source": "playbooks/price-negotiation", "target": "policies/order-conversion"}}, {"data": {"id": "policies/discount-approval__system/pricing-formula", "source": "policies/discount-approval", "target": "system/pricing-formula"}}, {"data": {"id": "policies/discount-approval__computations/price-change-impact", "source": "policies/discount-approval", "target": "computations/price-change-impact"}}, {"data": {"id": "policies/discount-approval__policies/pricing-factor-floor", "source": "policies/discount-approval", "target": "policies/pricing-factor-floor"}}, {"data": {"id": "policies/discount-approval__policies/discount-approval-2025", "source": "policies/discount-approval", "target": "policies/discount-approval-2025"}}, {"data": {"id": "policies/discount-approval-2025__policies/discount-approval", "source": "policies/discount-approval-2025", "target": "policies/discount-approval"}}, {"data": {"id": "policies/order-conversion__system/quotation-agent", "source": "policies/order-conversion", "target": "system/quotation-agent"}}, {"data": {"id": "policies/order-conversion__system/orders-table", "source": "policies/order-conversion", "target": "system/orders-table"}}, {"data": {"id": "policies/pricing-factor-floor__policies/discount-approval", "source": "policies/pricing-factor-floor", "target": "policies/discount-approval"}}, {"data": {"id": "policies/pricing-factor-floor__policies/promo-2026q3", "source": "policies/pricing-factor-floor", "target": "policies/promo-2026q3"}}, {"data": {"id": "policies/pricing-factor-floor__system/customer-levels", "source": "policies/pricing-factor-floor", "target": "system/customer-levels"}}, {"data": {"id": "policies/promo-2026q3__policies/pricing-factor-floor", "source": "policies/promo-2026q3", "target": "policies/pricing-factor-floor"}}, {"data": {"id": "system/backend-api__system/quotation-agent", "source": "system/backend-api", "target": "system/quotation-agent"}}, {"data": {"id": "system/customer-levels__policies/pricing-factor-floor", "source": "system/customer-levels", "target": "policies/pricing-factor-floor"}}, {"data": {"id": "system/orders-table__policies/order-conversion", "source": "system/orders-table", "target": "policies/order-conversion"}}, {"data": {"id": "system/pricing-formula__system/quotations-table", "source": "system/pricing-formula", "target": "system/quotations-table"}}, {"data": {"id": "system/pricing-formula__computations/price-change-impact", "source": "system/pricing-formula", "target": "computations/price-change-impact"}}, {"data": {"id": "system/quotation-agent__system/mcp-tools", "source": "system/quotation-agent", "target": "system/mcp-tools"}}, {"data": {"id": "system/quotations-table__system/pricing-formula", "source": "system/quotations-table", "target": "system/pricing-formula"}}], "bodies": {"computations/price-change-impact": "\n# Computation\n\n計算程式在 `computation` 指的檔案，`computation_sha256` 是登記的版本。Agent 只能提供 `quotation_number` 和 `target_total` 兩個值，不能自己算，也不能改程式。\n\n算法照 [報價金額怎麼算](/system/pricing-formula.md)：[^pricing-formula]\n\n1. 定價合計 L = Σ 定價 × 數量，成本合計 C = Σ 成本 × 數量，都用品項重算，不用資料庫存的總價與利潤。\n2. 需要的報價因子 = 目標總價 ÷ L，取到小數 4 位。\n3. 改價後總價 = L × 報價因子，利潤 = 總價 − C，毛利率 = 利潤 ÷ 總價（小數 4 位）。\n4. 報價因子只能在 0.01 到 5.0 之間，和 `adjust_total_price` 的二分法範圍一樣。[^mcp-tools] 超出時 `reachable` 是 false，結果停在邊界。\n5. 資料庫存的總價或利潤和重算不同時，寫在 `stored_mismatch`。\n\n# 收據與驗證\n\nexecutor 照 [執行說明](/references/skills/run-python-computation.md) 回傳收據，attester（`/references/attesters/recompute.py`）檢查五件事：計算程式的 sha256、參數、來源資料的 sha256、重算結果、要顯示的數字。任何一項不符，Agent 就不顯示數字。\n\n`adjust_total_price` 實際改出來的總價會因為二分法停在第 20 次，和試算差一點。試算是事前判斷規則用的，實際結果以報價單 Agent 的回覆為準。\n\n# 用到這個計算的條目\n\n- [改價核准層級](/policies/discount-approval.md)\n- [報價因子下限](/policies/pricing-factor-floor.md)\n- [業務議價處理流程](/playbooks/price-negotiation.md)\n\n[^pricing-formula]: 報價金額怎麼算\n[^mcp-tools]: EZStore MCP Server 的 6 個報價單工具\n", "glossary/pricing-factor": "\n# 意思\n\n報價因子是報價單上的倍率，所有品項共用一個：單價 = 定價 × 報價因子。[^pricing-formula] 0.8 就是打八折，1.0 是原價，大於 1 是比定價貴。\n\n系統存到小數 4 位。各客戶等級的預設值見 [客戶等級與預設報價因子](/system/customer-levels.md)，能降到多少見 [報價因子下限](/policies/pricing-factor-floor.md)。\n\n# 例子\n\nQT-20260330-001 的報價因子是 0.95，A4 影印紙定價 650，單價就是 617.5。\n\n[^pricing-formula]: 報價金額怎麼算\n", "glossary/profit-rate": "\n# 意思\n\n毛利率 = 利潤 ÷ 總價，利潤 = 總價 − 成本合計。[^pricing-formula] 系統欄位叫 `profit_rate`，存小數 4 位，0.2825 就是 28.25%。\n\n降價時成本不變，所以總價降多少，利潤就少多少，毛利率掉得比總價快。\n\n# 例子\n\nQT-20260325-001 依品項重算：總價 211560，成本合計 143500，利潤 68060，毛利率 32.17%。資料庫存的利潤是 66060，和重算不同，見 [報價單資料表](/system/quotations-table.md)。\n\n壓到 180000 時，利潤剩 36506.6，毛利率 20.28%，依 [改價核准層級](/policies/discount-approval.md) 要業務主管核准。\n\n[^pricing-formula]: 報價金額怎麼算\n", "playbooks/price-negotiation": "\n# 客戶要求降價\n\n1. **確認是哪張報價單、想壓到多少**。缺報價單編號或目標總價就先問。\n2. **試算**：跑 [改價影響試算](/computations/price-change-impact.md)，attester 驗證通過才看數字。\n3. **對照規則**：[改價核准層級](/policies/discount-approval.md) 看毛利率，[報價因子下限](/policies/pricing-factor-floor.md) 看因子，取比較嚴的層級。已作廢或已過期的規則不用。\n4. **業務可直接調整**：經 A2A 請 [報價單 Agent](/system/quotation-agent.md) 修改總價。它會先複製再改，原單不動，回覆附新報價單的連結。\n5. **需要核准**：不改資料，整理一段核准申請（報價單、客戶、目前與改價後的報價因子和毛利率、依據的規則），給業務主管或總經理。\n6. **不可報價**：直接告訴業務原因，建議改談數量或品項。\n\n# 客戶要轉訂單\n\n1. 依 [轉訂單規則](/policies/order-conversion.md) 檢查：報價單要已發佈，而且還沒有訂單。\n2. 通過才經 A2A 請報價單 Agent 轉訂單，回覆附訂單連結。\n3. 草稿要先在系統發佈；已經有訂單的，回覆既有的訂單編號。\n\n# 一般查詢\n\n查報價單、查客戶的報價單清單、複製報價單，直接經 A2A 交給報價單 Agent。\n", "policies/discount-approval-2025": "\n# 已作廢\n\n> 這是第一次作業的示範規則，用來示範 OKF 的 `status: deprecated`。\n\n現行規則是 [改價核准層級（2026 年版）](/policies/discount-approval.md)。這份只留著讓舊的報價紀錄看得懂，不可以拿來判斷新的改價。\n\n# 舊版門檻\n\n| 改價後毛利率 | 核准層級 |\n|---|---|\n| 20% 以上 | 業務可直接調整 |\n| 10% 以上、未滿 20% | 需業務主管核准 |\n| 0% 以上、未滿 10% | 需總經理核准 |\n| 虧損 | 不可報價 |\n\n2026 年版把每一級提高 5 個百分點，毛利率未滿 5% 就不可報價。\n", "policies/discount-approval": "\n# 規則\n\n> 這是第一次作業的示範規則，數字由作業設計，不是 EZStore 系統或老師提供的資料。系統本身沒有核准流程。\n\n改價後的毛利率（利潤 ÷ 總價）決定核准層級：\n\n| 改價後毛利率 | 核准層級 |\n|---|---|\n| 25% 以上（0.25） | 業務可直接調整 |\n| 15% 以上、未滿 25%（0.15–0.25） | 需業務主管核准 |\n| 5% 以上、未滿 15%（0.05–0.15） | 需總經理核准 |\n| 未滿 5%（0.05），或虧損 | 不可報價 |\n\n毛利率用品項重算，不用資料庫存的 `profit_amount`，算法見 [報價金額怎麼算](/system/pricing-formula.md)。[^pricing-formula] 改價的數字要用 [改價影響試算](/computations/price-change-impact.md) 算，驗證通過才可以拿來判斷。\n\n同一次改價也要看 [報價因子下限](/policies/pricing-factor-floor.md)，兩條規則取比較嚴的那一個。\n\n# 例子\n\nQT-20260325-001（神盾局科技，vip）定價合計 258000、成本合計 143500。報價因子取到小數 4 位後：\n\n| 目標總價 | 報價因子 | 毛利率 | 層級 |\n|---|---|---|---|\n| 200000 | 0.7752 | 28.25% | 業務可直接調整 |\n| 180000 | 0.6977 | 20.28% | 需業務主管核准（因子也低於 vip 下限 0.70） |\n| 160000 | 0.6202 | 10.32% | 需總經理核准 |\n| 150000 | 0.5814 | 4.33% | 不可報價 |\n\n舊版規則見 [2025 年版](/policies/discount-approval-2025.md)，已作廢。\n\n[^pricing-formula]: 報價金額怎麼算\n", "policies/order-conversion": "\n# 規則\n\n> 這是第一次作業的示範規則，不是 EZStore 系統或老師提供的資料。系統本身不會擋，報價單 Agent 也會直接轉。\n\n1. 報價單要是已發佈（`published`）才可以轉訂單。草稿代表還沒送給客戶，要先在系統發佈。\n2. 已經有訂單的報價單不再轉一次。已取消（`cancelled`）的訂單不算。[^orders-table]\n3. 兩條都符合，才經 A2A 請 [報價單 Agent](/system/quotation-agent.md) 轉訂單。\n\n# 為什麼要另外檢查\n\n`convert_to_order` 不看報價單狀態，也不擋重複轉換，同一張轉兩次就會有兩筆訂單。[^orders-table]\n\n# 例子\n\n- QT-20260115-001 已有訂單 ORD-20260118-001，不再轉。\n- QT-20260325-001 是草稿，要先發佈。\n- QT-20260301-001 已發佈、還沒有訂單，可以轉。\n\n[^orders-table]: 訂單資料表（orders、order_items）\n", "policies/pricing-factor-floor": "\n# 規則\n\n> 這是第一次作業的示範規則，數字由作業設計，不是 EZStore 系統或老師提供的資料。\n\n下限是各等級的預設報價因子再減 0.10：[^customer-levels]\n\n| 客戶等級 | 預設報價因子 | 下限 |\n|---|---|---|\n| `vip` | 0.80 | 0.70 |\n| `standard` | 0.90 | 0.80 |\n| `new` | 1.00 | 0.90 |\n\n改價後的報價因子低於下限，就要業務主管核准，毛利率再高也一樣。客戶等級看報價單上記的 `customer_level`。\n\n和 [改價核准層級](/policies/discount-approval.md) 一起看，取比較嚴的層級。\n\n# 例子\n\nQT-20260328-001（天空之城科技，new）定價合計 88000、成本合計 49500。客戶想壓到 76000 時，報價因子要 0.8636，毛利率 34.87%。毛利率夠，但因子低於 new 的下限 0.90，所以要業務主管核准。\n\n2026 第三季曾經把 new 的下限暫時降到 0.85，見 [第三季新客戶優惠](/policies/promo-2026q3.md)，已經過期。\n\n[^customer-levels]: 客戶等級與預設報價因子\n", "policies/promo-2026q3": "\n# 優惠內容\n\n> 這是第一次作業的示範規則，用來示範 OKF 的 `stale_after`：過了這個時間，條目就過期，不能再拿來判斷。\n\n2026 年 7 月 1 日到 9 月 30 日（台灣時間），new 等級客戶的報價因子下限從 0.90 暫時降到 0.85。[^factor-floor]\n\n`stale_after` 是 2026-09-30T16:00:00Z，也就是台灣時間 10 月 1 日 0 點。之後改回 [報價因子下限](/policies/pricing-factor-floor.md) 的 0.90。\n\n[^factor-floor]: 報價因子下限\n", "references/skills/run-python-computation": "\n# 什麼時候用\n\n條目的 `type` 是 `Attested Computation`、`runtime` 是 `python`，而且 `executor.resource` 指到這裡。\n\n# 前提\n\n- 呼叫端只提供條目 `parameters` 宣告過的參數值，型別要對，必填的都要有。\n- 不可以自己寫或改計算程式。計算程式就是條目 `computation` 指的那個檔案。\n\n# 步驟\n\n1. **讀條目**：從 frontmatter 取 `parameters`、`source_parameter`、`data_source`、`computation`、`executor.receipt`。\n2. **取得資料來源**：依 `data_source` 用 `source_parameter` 的值抓資料。改價影響試算是用 `quotation_number` 呼叫後端 `GET /api/v1/quotations?quotation_number=…&page_size=1` 找到 id，再 `GET /api/v1/quotations/{id}` 取完整 JSON。找不到就回錯誤收據，不要猜。\n3. **算來源的指紋**：把 JSON 依 key 排序、不留空白、UTF-8 編碼後算 sha256。\n4. **執行計算程式**：讀 `computation` 檔案、算 sha256，載入後呼叫 `compute(來源資料, 其他參數)`。`source_parameter` 只用來抓資料，不傳進 `compute`。\n5. **組收據**：只放 `executor.receipt` 列出的欄位：\n\n    ```json\n    {\n      \"computation\": \"/references/computations/price_change_impact.py\",\n      \"computation_sha256\": \"<計算程式的 sha256>\",\n      \"source_url\": \"http://backend:8080/api/v1/quotations/9\",\n      \"source_sha256\": \"<來源 JSON 的 sha256>\",\n      \"source\": {\"quotation_number\": \"QT-20260325-001\", \"...\": \"...\"},\n      \"parameters\": {\"quotation_number\": \"QT-20260325-001\", \"target_total\": 180000},\n      \"result\": {\"new_factor\": \"0.6977\", \"new_margin\": \"0.2028\", \"...\": \"...\"},\n      \"executed_at\": \"2026-10-17T02:00:00Z\"\n    }\n    ```\n\n6. **交給 attester**：把收據交給條目 `attester.resource` 指的程式。驗證通過之前，不可以把數字顯示給使用者。\n\n# 錯誤時\n\n參數綁不上、資料抓不到、計算丟出例外，都回 `{\"error\": \"原因\"}`，不要改計算程式來繞過。\n", "system/backend-api": "\n# 端點\n\n前綴都是 `/api/v1`。本機是 `http://localhost:8080`，Compose 內部是 `http://backend:8080`，前端 nginx 也會把 `/api/` 轉過去。[^routes]\n\n| 方法與路徑 | 用途 | 查詢參數 |\n|---|---|---|\n| `GET /quotations` | 報價單清單（含品項） | `page`、`page_size`（最多 100）、`status`、`customer_id`、`quotation_number`（精確） |\n| `GET /quotations/{id}` | 單張報價單（含客戶與品項） | |\n| `PUT /quotations/{id}` | 修改報價單，後端重算金額 | |\n| `POST /quotations/{id}/duplicate` | 複製成新草稿 | |\n| `POST /quotations/{id}/publish` | 發佈 | |\n| `DELETE /quotations/{id}` | 刪除（已發佈的不行） | |\n| `GET /orders` | 訂單清單 | `page`、`page_size`、`status`、`customer_id` |\n| `GET /orders/{id}` | 單筆訂單 | |\n| `POST /orders` | 建立訂單 | |\n| `GET /customers` | 客戶清單 | `search`（名稱模糊搜尋）、`page`、`page_size` |\n| `GET /pricing-factor/{level}` | 預設報價因子 | |\n\n`GET /orders` 不能用報價單篩選。要找某張報價單有沒有訂單，先用報價單的 `customer_id` 篩，再比對每筆訂單的 `quotation_id`。[^order-repo]\n\n清單回傳格式是 `{\"data\": [...], \"total\": N, \"page\": 1, \"page_size\": 20}`。\n\n議價顧問 Agent 只用 `GET`。會改資料的動作一律經 [報價單 Agent](/system/quotation-agent.md) 處理。\n\n[^routes]: EZStore 後端 routes.go\n[^order-repo]: EZStore 後端 order_repo.go\n", "system/customer-levels": "\n# 預設報價因子\n\n| 客戶等級 | 預設報價因子 | 意思 |\n|---|---|---|\n| `vip` | 0.80 | 定價打八折 |\n| `standard` | 0.90 | 九折 |\n| `new` | 1.00 | 原價 |\n\n數字來自後端的 `DefaultPricingFactor`。[^customer-model] 程式裡不認得的等級字串預設也是 0.90，但 API 只接受這三種等級。\n\n`GET /api/v1/pricing-factor/{level}` 回傳 `{\"level\": \"vip\", \"pricing_factor\": \"0.8\"}`；等級不是這三種時回 400 `INVALID_LEVEL`。[^pricing-factor-handler] API 說明寫報價人員建單時可以自己調整這個值。[^pricing-factor-handler]\n\n報價單會記下建單當下的客戶等級（`customer_level`）。報價因子能調到多低，見 [報價因子下限](/policies/pricing-factor-floor.md)。\n\n[^customer-model]: EZStore 後端 models/customer.go（DefaultPricingFactor）\n[^pricing-factor-handler]: EZStore 後端 pricing_factor_handler.go\n", "system/mcp-tools": "\n# 工具\n\nStreamable HTTP，Compose 內部 `http://mcp-server:8000/mcp`，對本機開 `http://localhost:8010/mcp`。[^mcp-server]\n\n| 工具 | 參數 | 做什麼 |\n|---|---|---|\n| `get_quotation` | `quotation_number` | 查報價單與品項 |\n| `list_customer_quotations` | `customer_name` | 客戶名稱模糊搜尋，完全相符的優先 |\n| `duplicate_quotation` | `quotation_number` | 複製成新草稿 |\n| `update_pricing_factor` | `quotation_number`、`new_pricing_factor` | 先複製，再改副本的報價因子 |\n| `adjust_total_price` | `quotation_number`、`target_total_price` | 先複製，再用二分法調副本的報價因子 |\n| `convert_to_order` | `quotation_number` | 依報價單建訂單 |\n\n# 規則\n\n- 會改資料的工具都先複製，改的是副本，原單不動，回覆會寫「原始報價單：…（未修改）」。[^mcp-server]\n- 每則回覆附純文字連結，例如 `http://localhost:3000/quotations/12`、`http://localhost:3000/orders/11`。[^mcp-server]\n- 報價因子與目標總價要大於 0，否則回「報價因子必須大於 0」「目標總價必須大於 0」。找不到報價單回「找不到報價單編號 …」。[^mcp-server]\n\n# 改總價的二分法\n\n`adjust_total_price` 在報價因子 0.01 到 5.0 之間二分搜尋，每次把因子取到小數 4 位、寫回副本看總價，最多 20 次，和目標差不到 0.01 就停。[^mcp-server] 20 次後還沒到，回覆會加一句「注意: 已達最大迭代次數」。所以總價最高只能到定價合計 × 5.0，最低是定價合計 × 0.01。\n\n[^mcp-server]: MCP Server server.py\n", "system/orders-table": "\n# Schema\n\n`orders`[^order-model]\n\n| 欄位 | 說明 |\n|---|---|\n| `order_number` | 格式 `ORD-YYYYMMDD-NNN` |\n| `customer_id` | 客戶 |\n| `quotation_id` | 來源報價單，可以是空的（直接下單） |\n| `total_price` | 訂單總價 |\n| `status` | 預設 `pending`；測試資料另有 `confirmed`、`completed`、`cancelled` |\n\n`order_items` 存產品、單價、數量、小計。\n\n# 報價單轉訂單\n\nMCP 工具 `convert_to_order` 依報價單的客戶與品項建一筆訂單，`quotation_id` 指回報價單，備註寫「從報價單 QT-… 轉換」。報價單本身不會改，也不會被發佈。[^mcp-server] 系統沒有擋重複轉換，同一張報價單轉兩次就會有兩筆訂單。\n\n# 測試資料裡已經有訂單的報價單\n\n重灌 seed 後：[^seed]\n\n| 報價單 | 訂單 | 訂單狀態 |\n|---|---|---|\n| QT-20260115-001 | ORD-20260118-001 | completed |\n| QT-20260120-001 | ORD-20260125-001 | confirmed |\n| QT-20260205-001 | ORD-20260208-001 | confirmed |\n| QT-20260210-001 | ORD-20260212-001 | completed |\n| QT-20260218-001 | ORD-20260322-001 | pending |\n| QT-20260305-001 | ORD-20260308-001 | confirmed |\n| QT-20260310-001 | ORD-20260325-001 | pending |\n\nQT-20260301-001 已發佈但還沒有訂單；QT-20260325-001、QT-20260326-001、QT-20260328-001、QT-20260330-001 是草稿。轉訂單前的檢查見 [轉訂單規則](/policies/order-conversion.md)。\n\n[^order-model]: EZStore 後端 models/order.go\n[^mcp-server]: MCP Server server.py（convert_to_order）\n[^seed]: 測試資料 seed-test-data.sql\n", "system/pricing-formula": "\n# 公式\n\n| 欄位 | 算法 |\n|---|---|\n| 單價 `unit_price` | 定價 `list_price` × 報價因子 `pricing_factor`[^quotation-service] |\n| 小計 `subtotal` | 單價 × 數量[^quotation-service] |\n| 總價 `total_price` | 所有品項小計相加[^quotation-service] |\n| 利潤 `profit_amount` | 每個品項（單價 − 成本 `product_cost`）× 數量，再相加[^quotation-service] |\n| 利潤率 `profit_rate` | 利潤 ÷ 總價，總價是 0 時記 0[^quotation-service] |\n\n報價因子存到小數 4 位（`decimal(5,4)`），利潤率也是小數 4 位，金額是小數 2 位。[^quotation-model] 一張報價單只有一個報價因子，所有品項用同一個。\n\n換個方式看：定價合計 L = Σ 定價 × 數量，成本合計 C = Σ 成本 × 數量，那麼總價 = L × 報價因子，利潤 = 總價 − C。\n\n# 什麼時候會重算\n\n- 建立、修改（PUT）、複製報價單時，後端會依上面的公式重算。[^quotation-service]\n- 複製時會重新讀產品目前的定價與成本，報價因子沿用原單。[^quotation-service]\n- 已發佈（`published`）的報價單不能修改也不能刪除。[^quotation-service]\n\n測試資料是直接用 SQL 寫進資料庫的，有些報價單存的利潤和用品項重算的不一樣，見 [報價單資料表](/system/quotations-table.md)。試算一律用品項重算，見 [改價影響試算](/computations/price-change-impact.md)。\n\n[^quotation-service]: EZStore 後端 quotation_service.go（buildItems、computeTotals、Duplicate）\n[^quotation-model]: EZStore 後端 models/quotation.go\n", "system/quotation-agent": "\n# 位置\n\n| 從哪裡連 | agent card | JSON-RPC 端點 |\n|---|---|---|\n| Compose 內部 | `http://agent:8080/a2a/quotation_agent/.well-known/agent-card.json` | `http://agent:8080/a2a/quotation_agent` |\n| 本機（經前端 nginx） | `http://localhost:3000/agent-api/a2a/quotation_agent/.well-known/agent-card.json` | `http://localhost:3000/agent-api/a2a/quotation_agent` |\n\nagent card 裡的位址是 Compose 內部的 `http://agent:8080/...`。經 nginx 連的時候，JSON-RPC 要送到取得 card 的同一個位址。[^quotation-agent-code]\n\n# Skill 與例句\n\n| skill id | 例句 |\n|---|---|\n| `get_quotation` | 我要查詢報價單，報價單編號：QT-20260330-001 |\n| `list_customer_quotations` | 我要查詢客戶的報價單清單，客戶名稱：史塔克工業 |\n| `duplicate_quotation` | 我要複製報價單，報價單編號：QT-20260330-001 |\n| `update_pricing_factor` | 我要修改報價單報價因子，報價單編號：QT-20260330-001，報價因子改為 1.5 |\n| `adjust_total_price` | 我要修改報價單總價，報價單編號：QT-20260330-001，總價改為 8000 |\n| `convert_to_order` | 我要將報價單轉訂單，報價單編號：QT-20260330-001 |\n\n照例句的句型、一次給齊欄位，報價單 Agent 就不會追問。[^quotation-agent-code]\n\n# 回覆\n\n- A2A task 完成時只有一個 artifact，內容就是 Chat UI 會看到的那段文字（respond 節點）。\n- 會改資料的操作都是先複製再改，原單不動，見 [MCP 工具](/system/mcp-tools.md)。\n- 跟報價單無關的要求一律拒答，回覆含「只能協助報價單相關的操作」。\n- 缺欄位時回「請提供…」。\n\n[^quotation-agent-code]: 報價單 Agent 原始碼（agent.py、fast_api_app.py、app_utils/a2a.py）\n", "system/quotations-table": "\n# Schema\n\n`quotations`（一張報價單一筆）[^quotation-model]\n\n| 欄位 | 型別 | 說明 |\n|---|---|---|\n| `quotation_number` | varchar(50)，唯一 | 格式 `QT-YYYYMMDD-NNN` |\n| `customer_id` | uint | 客戶 |\n| `customer_level` | varchar(20) | 建單當下的客戶等級：`vip`、`standard`、`new` |\n| `pricing_factor` | decimal(5,4) | 報價因子 |\n| `total_price` | decimal(14,2) | 總價 |\n| `profit_amount` | decimal(14,2) | 利潤 |\n| `profit_rate` | decimal(5,4) | 利潤率 |\n| `status` | varchar(20) | `draft`（草稿）或 `published`（已發佈），預設 `draft` |\n| `notes` | text | 備註；複製出來的單會寫「複製自 QT-…」 |\n\n`quotation_items`（報價品項）[^quotation-model]\n\n| 欄位 | 說明 |\n|---|---|\n| `product_id`、`product_name` | 產品與名稱快照 |\n| `product_cost`、`list_price` | 建單當下的成本與定價快照 |\n| `unit_price`、`quantity`、`subtotal` | 單價、數量、小計 |\n\n計算方式見 [報價金額怎麼算](/system/pricing-formula.md)。\n\n# 測試資料的不一致\n\n2026-10-17 用後端 API 讀出 12 張報價單、依品項重算後比對：[^seed]\n\n- QT-20260115-001 存的總價是 253500，品項小計加起來是 253350。\n- 7 張存的利潤和重算不同：QT-20260115-001（存 72000、重算 66150）、QT-20260120-001（82120、86570）、QT-20260210-001（21320、22720）、QT-20260218-001（39450、52130）、QT-20260325-001（66060、68060）、QT-20260326-001（39960、52960）、QT-20260328-001（33000、38500）。\n- 單價都等於定價 × 報價因子。\n\n測試資料是 SQL 直接寫入，沒有經過後端重算。後端建立、修改、複製的報價單沒有這個問題。\n\n[^quotation-model]: EZStore 後端 models/quotation.go\n[^seed]: 測試資料 seed-test-data.sql\n"}, "types": ["A2A Agent", "API Endpoint", "Attested Computation", "Business Rule", "Glossary Term", "MCP Server", "Playbook", "Policy", "PostgreSQL Table", "Skill"], "palette": {"Policy": "#f97316", "Attested Computation": "#8b5cf6", "Business Rule": "#0ea5e9", "PostgreSQL Table": "#3b82f6", "API Endpoint": "#14b8a6", "MCP Server": "#10b981", "A2A Agent": "#22c55e", "Playbook": "#eab308", "Glossary Term": "#a3a3a3", "Skill": "#ec4899"}};
</script>

(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
